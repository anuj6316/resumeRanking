<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screening System</title>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border: 2px dashed #ddd;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-input-wrapper {
            position: relative;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
            display: block;
            width: 100%;
        }

        .upload-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .file-count {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .progress-container {
            margin-top: 10px;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            height: 8px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
            text-align: center;
            display: none;
        }

        .resume-list {
            flex: 1;
            overflow-y: auto;
        }

        .resume-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border-left: 3px solid #667eea;
        }

        .resume-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .resume-id {
            font-size: 12px;
            color: #666;
            font-family: monospace;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .view-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-btn:hover {
            background: #5568d3;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            animation: slideIn 0.3s ease-out;
            line-height: 1.6;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: #f0f4ff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Markdown styling for AI messages */
        .ai-message h1, .ai-message h2, .ai-message h3 {
            margin-top: 12px;
            margin-bottom: 8px;
            color: #667eea;
        }

        .ai-message h1 { font-size: 1.5em; }
        .ai-message h2 { font-size: 1.3em; }
        .ai-message h3 { font-size: 1.1em; }

        .ai-message p {
            margin-bottom: 8px;
        }

        .ai-message ul, .ai-message ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .ai-message li {
            margin-bottom: 4px;
        }

        .ai-message code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .ai-message pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .ai-message pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .ai-message blockquote {
            border-left: 4px solid #667eea;
            padding-left: 12px;
            margin: 8px 0;
            color: #666;
            font-style: italic;
        }

        .ai-message strong {
            font-weight: 600;
            color: #667eea;
        }

        .ai-message table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
        }

        .ai-message table th,
        .ai-message table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        .ai-message table th {
            background: #667eea;
            color: white;
        }

        .chat-input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input:disabled {
            background: #e9ecef;
            cursor: not-allowed;
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .send-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .status-message {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }

        .stats {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #667eea;
            font-weight: 600;
        }

        .jd-upload-section {
            background: #fff3cd;
            border: 2px dashed #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .jd-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dc3545;
        }

        .status-indicator.active {
            background: #28a745;
        }

        .n-selector {
            margin-top: 10px;
        }

        .n-selector label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .n-selector input {
            width: 100%;
            padding: 8px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
        }

        .n-selector input:focus {
            outline: none;
            border-color: #ffc107;
        }

        .refresh-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: auto;
        }

        .refresh-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h1>🎯 Resume Screener</h1>
            
            <!-- Stats -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Resumes:</span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="stat-value" id="totalResumes">Loading...</span>
                        <button class="refresh-btn" onclick="fetchTotalResumes()" title="Refresh count">🔄</button>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Filtered:</span>
                    <span class="stat-value" id="filteredResumes">0</span>
                </div>
            </div>

            <!-- JD Upload -->
            <div class="jd-upload-section">
                <h2>📄 Job Description</h2>
                <div class="n-selector">
                    <label for="topN">Number of top candidates:</label>
                    <input type="number" id="topN" value="5" min="1" max="100">
                </div>
                <div class="file-input-wrapper" style="margin-top: 10px;">
                    <label for="jdFile" class="upload-btn">Upload JD</label>
                    <input type="file" id="jdFile" accept=".pdf,.doc,.docx" onchange="uploadJD()">
                </div>
                <div class="jd-status">
                    <div class="status-indicator" id="jdIndicator"></div>
                    <span id="jdStatus">No JD uploaded</span>
                </div>
            </div>

            <!-- Resume Upload -->
            <div class="upload-section">
                <h2>📁 Upload Resumes</h2>
                <div class="file-input-wrapper">
                    <label for="cvFiles" class="upload-btn">Choose Files</label>
                    <input type="file" id="cvFiles" accept=".pdf,.doc,.docx" multiple onchange="handleFileSelect()">
                </div>
                <div class="file-count" id="fileCount">No files selected</div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>

            <!-- Filtered Resume List -->
            <div style="flex: 1; display: flex; flex-direction: column;">
                <h2>🎯 Top Candidates</h2>
                <div class="resume-list" id="resumeList">
                    <div class="empty-state">Upload a JD to see filtered resumes</div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <h2>💬 AI Assistant</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="status-message" id="statusMessage">
                        Please upload a Job Description and wait for resume filtering to start chatting
                    </div>
                </div>
                <div class="chat-input-container">
                    <input 
                        type="text" 
                        id="chatInput" 
                        class="chat-input" 
                        placeholder="Ask about candidates..."
                        disabled
                        onkeypress="handleKeyPress(event)"
                    >
                    <button id="sendBtn" class="send-btn" disabled onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let selectedFiles = [];
        let filteredResumeIds = [];
        let jdText = null;
        let isProcessing = false;

        // Configure marked.js for better markdown rendering
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: false,
            mangle: false
        });

        // Fetch total resumes on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchTotalResumes();
        });

        async function fetchTotalResumes() {
            try {
                const response = await fetch(`${API_BASE_URL}/total-resumes/`);
                const data = await response.json();
                
                if (response.ok && data.total !== undefined) {
                    document.getElementById('totalResumes').textContent = data.total;
                } else {
                    document.getElementById('totalResumes').textContent = '0';
                }
            } catch (error) {
                console.error('Error fetching total resumes:', error);
                document.getElementById('totalResumes').textContent = 'Error';
            }
        }

        function handleFileSelect() {
            const input = document.getElementById('cvFiles');
            selectedFiles = Array.from(input.files);
            const fileCount = document.getElementById('fileCount');
            
            if (selectedFiles.length > 0) {
                fileCount.textContent = `${selectedFiles.length} file(s) selected`;
                uploadResumes();
            } else {
                fileCount.textContent = 'No files selected';
            }
        }

        async function uploadResumes() {
            if (selectedFiles.length === 0) return;

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressContainer.style.display = 'block';
            progressText.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                const totalFiles = selectedFiles.length;
                let uploadedFiles = 0;

                // Simulate progress (since we can't get real upload progress easily)
                const progressInterval = setInterval(() => {
                    if (uploadedFiles < totalFiles) {
                        const progress = ((uploadedFiles + 0.5) / totalFiles) * 100;
                        progressBar.style.width = progress + '%';
                        progressText.textContent = `Uploading... ${uploadedFiles}/${totalFiles} completed`;
                    }
                }, 100);

                const response = await fetch(`${API_BASE_URL}/upload-cv/`, {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                const result = await response.json();
                
                if (response.ok) {
                    uploadedFiles = totalFiles;
                    progressBar.style.width = '100%';
                    progressText.textContent = `✓ Successfully uploaded ${totalFiles} resume(s)!`;
                    
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressText.style.display = 'none';
                        progressBar.style.width = '0%';
                    }, 3000);

                    selectedFiles = [];
                    document.getElementById('cvFiles').value = '';
                    document.getElementById('fileCount').textContent = 'No files selected';
                    
                    // Refresh total count
                    fetchTotalResumes();
                } else {
                    progressText.textContent = '✗ Error uploading resumes';
                    progressText.style.color = '#dc3545';
                }
            } catch (error) {
                progressText.textContent = '✗ Error: ' + error.message;
                progressText.style.color = '#dc3545';
            }
        }

        async function uploadJD() {
            const input = document.getElementById('jdFile');
            const file = input.files[0];
            
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const topN = parseInt(document.getElementById('topN').value) || 5;

            try {
                isProcessing = true;
                updateJDStatus('Processing...', false);
                
                const response = await fetch(`${API_BASE_URL}/scores/?n=${topN}`, {
                    method: 'POST',
                    body: formData
                });

                const scores = await response.json();
                
                if (response.ok) {
                    filteredResumeIds = Object.keys(scores).slice(0, topN);
                    jdText = file.name;
                    
                    updateJDStatus('JD uploaded & processed', true);
                    displayFilteredResumes(scores, topN);
                    enableChat();
                } else {
                    alert('Error processing JD: ' + JSON.stringify(scores));
                    updateJDStatus('Error processing JD', false);
                }
            } catch (error) {
                alert('Error uploading JD: ' + error.message);
                updateJDStatus('Error uploading JD', false);
            } finally {
                isProcessing = false;
            }
        }

        function updateJDStatus(status, isActive) {
            document.getElementById('jdStatus').textContent = status;
            const indicator = document.getElementById('jdIndicator');
            if (isActive) {
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
            }
        }

        function displayFilteredResumes(scores, topN) {
            const resumeList = document.getElementById('resumeList');
            resumeList.innerHTML = '';

            const topResumes = Object.entries(scores).slice(0, topN);

            topResumes.forEach(([id, scoreData], index) => {
                const item = document.createElement('div');
                item.className = 'resume-item';
                item.innerHTML = `
                    <div>
                        <div style="font-weight: 600; color: #667eea; margin-bottom: 4px;">
                            Rank ${index + 1} - Score: ${scoreData.overall_score}
                        </div>
                        <div class="resume-id" title="${id}">${id}</div>
                    </div>
                    <button class="view-btn" onclick="viewResume('${id}')">View</button>
                `;
                resumeList.appendChild(item);
            });

            document.getElementById('filteredResumes').textContent = topN;
        }

        function viewResume(id) {
            alert(`Resume viewing endpoint not yet implemented.\nResume ID: ${id}`);
        }

        function enableChat() {
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('statusMessage').style.display = 'none';
            
            addAIMessage("Hello! I'm ready to help you analyze the top candidates. Ask me anything about their qualifications, experience, or fit for the role.");
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message || isProcessing) return;

            addUserMessage(message);
            input.value = '';

            showLoading();
            isProcessing = true;

            try {
                const response = await fetch(`${API_BASE_URL}/query/?n=${filteredResumeIds.length}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        Query: message
                    })
                });

                const result = await response.json();
                
                hideLoading();

                if (response.ok && result.results) {
                    addAIMessage(result.results);
                } else {
                    addAIMessage('Sorry, I encountered an error processing your request.');
                }
            } catch (error) {
                hideLoading();
                addAIMessage('Sorry, I encountered an error: ' + error.message);
            } finally {
                isProcessing = false;
            }
        }

        function addUserMessage(text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
        }

        function addAIMessage(text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';
            
            // Render markdown
            messageDiv.innerHTML = marked.parse(text);
            
            messagesDiv.appendChild(messageDiv);
        }

        function showLoading() {
            const messagesDiv = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message loading';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = `
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            `;
            messagesDiv.appendChild(loadingDiv);
        }

        function hideLoading() {
            const loading = document.getElementById('loadingIndicator');
            if (loading) {
                loading.remove();
            }
        }
    </script>
</body>
</html>
